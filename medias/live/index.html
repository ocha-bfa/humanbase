<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veille médias — démo live</title>
</head>
<body style="font:14px 'Segoe UI',sans-serif;color:#4A6070;text-align:center;padding:60px">
Chargement de la démonstration… / Loading the demo…
<script>
// Démo LIVE : on charge la VRAIE application ../index.html (toujours à jour) et on remplace seulement
// la connexion (auth.js) et la base de données par live.js : articles du jour triés par l'IA, en lecture seule ;
// les actions du visiteur restent dans son navigateur. Un pays = une configuration (sources, rubriques, langue, moteur).
(async () => {
  const SB = 'https://vshnatreclfntadwcyhy.supabase.co';
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzaG5hdHJlY2xmbnRhZHdjeWh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyOTA4NzcsImV4cCI6MjA4OTg2Njg3N30.VOxHkUKvYKtsdc2iwmsDMP9w-BWh3LZ4ZFLD4-qzjd8';
  const get = p => fetch(SB + '/rest/v1/' + p, { headers: { apikey: ANON, Authorization: 'Bearer ' + ANON } }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  try {
    const [countries, sections, page] = await Promise.all([
      get('media_public_live_countries?select=code,name_fr,ui_lang&order=name_fr'),
      get('media_public_sections?select=country_code,code,label,ordre&order=ordre'),
      fetch('../index.html', { cache: 'no-cache' }).then(r => r.text())]);
    if (!countries.length) throw new Error('aucun pays disponible / no country available');
    let code = new URLSearchParams(location.search).get('c');
    if (!code) { try { code = localStorage.getItem('mm_live_country'); } catch (e) {} }
    const country = countries.find(c => c.code === code) || countries[0];
    try { localStorage.setItem('mm_live_country', country.code); } catch (e) {}
    const EN = country.ui_lang === 'en';
    const name = country.name_fr, office = country.code === 'BFA' ? 'OCHA Burkina Faso' : name;
    const secs = sections.filter(s => s.country_code === country.code).map(s => [s.code, s.label]);
    const pairs = EN ? await fetch('../demo/en.json', { cache: 'no-cache' }).then(r => r.json()) : [];

    const inline = '<script>window.LIVE_COUNTRY=' + JSON.stringify(country.code) + ';window.LIVE_LANG=' + JSON.stringify(EN ? 'en' : 'fr') +
      ';window.LIVE_SECTIONS=' + JSON.stringify(secs).replace(/<\//g, '<\\/') + ';window.LIVE_COUNTRIES=' + JSON.stringify(countries).replace(/<\//g, '<\\/') +
      ';window.LIVE_ALLSECTIONS=' + JSON.stringify(sections).replace(/<\//g, '<\\/') + ';<\/script>';
    const btn = "display:inline-block;white-space:nowrap;border:1px solid #C9A55A;background:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit;color:inherit;line-height:1.45;text-decoration:none";
    const sw = countries.map(c => `<button onclick="LIVE_SWITCH('${esc(c.code)}')" style="${btn};${c.code === country.code ? 'background:#5C3D00;color:#fff;border-color:#5C3D00' : ''}">${esc(c.name_fr)}</button>`).join(' ');
    const bar = EN
      ? `<b>Live demo</b> — real articles, collected automatically and sorted today by AI (<span id="liveEngine">…</span>; last run <span id="liveLast">…</span>), three times a day.
         Try everything: Retain / Discard, sections, summaries, order, Word / CSV export, sources. Your choices stay <b>in your browser</b> only.
         <span style="white-space:nowrap;margin-left:6px">${sw} <button onclick="LIVE_RESET()" style="${btn};margin-left:4px">↺ Reset</button></span>`
      : `<b>Démo live</b> — articles réels, collectés automatiquement et triés aujourd'hui par l'IA (<span id="liveEngine">…</span> ; dernier tri <span id="liveLast">…</span>), 3 fois par jour.
         Essayez tout : Retenu / Écarté, rubriques, résumés, ordre, export Word / CSV, sources. Vos choix restent <b>dans votre navigateur</b> uniquement.
         <span style="white-space:nowrap;margin-left:6px">${sw} <button onclick="LIVE_RESET()" style="${btn};margin-left:4px">↺ Réinitialiser</button></span>`;

    let h = page;
    const swaps = [
      ['<script src="../auth.js"><\/script>', () => inline + '<script src="live.js?v=' + Date.now() + '"><\/script>'],
      ['async function api(', 'async function api_reel('],
      [/const SECTIONS = \[[\s\S]*?\n\];/, 'const SECTIONS = window.LIVE_SECTIONS;'],
      ["(a.section || 'NAT')", '(a.section || SECTIONS[0][0])', true],
      ['const inDays = a => a.week_start === CUR_WEEK;', 'const inDays = a => new Date(a.published_at) > Date.now() - 7 * 864e5;'],
      ['Semaine ${esc(weekLabel(CUR_WEEK))}', EN ? 'Last 7 days' : '7 derniers jours'],
      ["'Monitoring_medias_OCHA_BFA_semaine_'", JSON.stringify((EN ? 'Media_monitoring_' : 'Monitoring_medias_') + office.replace(/\W+/g, '_') + (EN ? '_week_' : '_semaine_'))],
      ["'OCHA Burkina Faso — semaine ' + weekLabel", JSON.stringify(office + (EN ? ' — week ' : ' — semaine ')) + ' + weekLabel'],
      ['<title>Monitoring médias — OCHA Burkina Faso</title>', `<title>${EN ? 'Live demo — Media monitoring' : 'Démo live — Monitoring médias'} — ${esc(name)}</title>`],
      ['<small>OCHA BURKINA FASO</small>', `<small>${esc(office.toUpperCase())} · ${EN ? 'LIVE DEMO' : 'DÉMO LIVE'}</small>`],
      ['<button data-v="src">Sources</button>', '<button data-v="src">Sources</button><button data-v="cfg">⚙ Configuration</button>'],
      ["if (v === 'tri') renderTri();", "if (v === 'cfg') { window.LIVE_CFG(); return; } if (v === 'tri') renderTri();"],
      ["'mm_view'", "'mm_live_view'", true],
      ['<body>', () => `<body><div id="demoBar" style="background:#FFF4DC;color:#5C3D00;border-bottom:1px solid #F0D9A8;font:13px/1.6 'DM Sans','Segoe UI',sans-serif;padding:8px 16px;text-align:center">${bar}</div>`],
    ];
    for (const [a, b, all] of swaps) {
      const found = a instanceof RegExp ? a.test(h) : h.includes(a);
      if (!found) throw new Error('application principale modifiée / main app changed (« ' + String(a).slice(0, 40) + ' »)');
      if (all) h = h.split(a).join(b); else h = h.replace(a, b);
    }
    for (const [fr, en] of pairs) h = h.split(fr).join(en);
    document.open(); document.write(h); document.close();
  } catch (e) {
    document.body.textContent = 'La démonstration n’a pas pu se charger / The demo could not load: ' + e.message;
  }
})();
</script>
</body>
</html>
